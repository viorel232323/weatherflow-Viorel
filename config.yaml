# WeatherFlow settings. Paths are relative to the folder that contains this file.

api:
  forecast_url: https://api.open-meteo.com/v1/forecast
  archive_url: https://archive-api.open-meteo.com/v1/archive
  timeout_seconds: 10
  max_retries: 3            # retries after the first try, so at most 4 requests
  past_days: 1
  forecast_days: 1
  timezone: UTC             # always request UTC; London time is worked out in transform
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - apparent_temperature
    - precipitation
    - wind_speed_10m
    - weather_code
    - is_day                

cities:
  - {name: London,     country: England,  latitude: 51.50853, longitude: -0.12574}
  - {name: Manchester, country: England,  latitude: 53.48095, longitude: -2.23743}
  - {name: Birmingham, country: England,  latitude: 52.48142, longitude: -1.89983}
  - {name: Edinburgh,  country: Scotland, latitude: 55.95206, longitude: -3.19648}
  - {name: Cardiff,    country: Wales,    latitude: 51.48,    longitude: -3.18}

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  quarantine_dir: data/quarantine
  database: data/weather.db
  log_file: logs/pipeline.log
  schema: sql/schema.sql

logging:
  level: INFO


dim_date:                  # every date in this range gets a row in dim_date
  start: 2025-01-01
  end: 2027-12-31